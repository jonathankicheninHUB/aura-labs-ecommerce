      <stop offset="0%" stop-color="#F3E3C3" />
      <stop offset="35%" stop-color="#D4B483" />
      <stop offset="70%" stop-color="#B08D57" />
      <stop offset="100%" stop-color="#7E5E2E" />
    </linearGradient>
