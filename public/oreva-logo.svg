  <path d="M60 32 L62.5 55.5 L86 60 L62.5 64.5 L60 88 L57.5 64.5 L34 60 L57.5 55.5 Z" fill="#090C12" opacity="0.35" />
  <circle cx="60" cy="60" r="4.5" fill="#F9F1DF" />

