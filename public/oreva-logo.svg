  <ellipse cx="60" cy="60" rx="42" ry="18" fill="none" stroke="url(#orevaGold)" stroke-width="0.9" opacity="0.55" transform="rotate(30 60 60)" />

  <!-- Étoile Polaire Clinique Centrale (8 branches Haute Précision) -->
